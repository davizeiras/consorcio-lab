<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar · Iran Solutions</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/styles.css"><script type="module" src="/login.js"></script></head><body>
<main class="auth-shell card"><a class="auth-brand" href="/login"><img src="/logo.jpg" alt="Iran Solutions" width="72" height="72"><strong>Iran Solutions</strong></a>
<h1 id="auth-title">Entre na sua conta</h1><p id="auth-help">Seu acesso ao simulador depende da aprovação do administrador.</p>
<form id="auth-form"><label id="name-label" hidden>Seu nome<input name="name" id="auth-name" autocomplete="name" maxlength="80"></label><label>E-mail<input id="auth-email" type="email" name="email" autocomplete="username" required maxlength="254"></label><label>Senha<input id="auth-password" type="password" name="password" autocomplete="current-password" required maxlength="128"></label><button id="auth-submit" class="button primary">Entrar</button></form>
<p id="auth-message" class="auth-message" role="status" aria-live="polite"></p><div class="auth-actions"><button id="auth-toggle" class="text-button">Solicitar acesso</button><button id="check-access" class="button secondary" hidden>Verificar aprovação</button><button id="auth-logout" class="text-button" hidden>Sair desta conta</button></div>
<p class="field-help">Somente você conhece sua senha. O administrador pode liberar ou bloquear seu acesso.</p></main></body></html>
